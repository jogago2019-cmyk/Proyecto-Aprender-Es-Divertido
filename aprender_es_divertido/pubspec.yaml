name: aprender_es_divertido
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^5.0.1
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  path: ^1.8.3
  permission_handler: ^11.2.0
  shared_preferences: ^2.2.2
  advance_pdf_viewer: ^2.0.0
  file_picker: ^8.3.7
  pdfx: ^2.11.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/imagends/logo_aprender_es_divertido.png
    - assets/imagends/fondo_logo.jpg
    - assets/imagends/lengua_materia.png
    - assets/imagends/logo2.png
    - assets/sounds/softpop_sfx.mp3
    - assets/sounds/audio_logo.mp3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/imagends/logo_aprender_es_divertido.png"
  adaptive_icon_background: "assets/imagends/logo2.png"
  adaptive_icon_foreground: "assets/imagends/logo_aprender_es_divertido.png"